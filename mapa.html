<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globus 3D - Siatka i Współrzędne</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background: #07090e; user-select: none; }

        /* --- EKRAN STARTOWY / WYBÓR JĘZYKA --- */
        #welcome-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e2640 0%, #07090e 100%);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; transition: opacity 0.6s ease, visibility 0.6s;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .welcome-card {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px;
            padding: 40px 50px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 480px; width: 90%;
        }
        .welcome-card h1 { margin: 0 0 10px 0; font-size: 28px; color: #38bdf8; font-weight: 700; letter-spacing: 1px; }
        .welcome-card p { margin-bottom: 30px; color: #94a3b8; font-size: 15px; }

        .lang-buttons { display: flex; gap: 15px; justify-content: center; }
        .lang-btn {
            background: #1e293b; border: 1px solid #334155; color: white;
            padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 15px;
            font-weight: 600; transition: all 0.25s ease; display: flex; align-items: center; gap: 8px;
        }
        .lang-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; transform: translateY(-2px); }

        /* --- PANEL STEROWANIA SIATKĄ --- */
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            color: #fff; padding: 18px 22px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 330px; transition: opacity 0.3s;
        }
        .section-title { font-weight: bold; font-size: 13px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 5px; margin-top: 5px; letter-spacing: 0.5px; }
        .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
        input[type=range] { cursor: pointer; width: 110px; accent-color: #38bdf8; }
        input[type=color] { cursor: pointer; border: none; width: 32px; height: 24px; border-radius: 4px; background: none; }
        .val { font-weight: bold; min-width: 35px; text-align: right; color: #cbd5e1; }

        /* --- DOLNY PANEL ZE WSPÓŁRZĘDNYMI --- */
        #bottom-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            color: #fff; padding: 14px 24px; border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.4); display: flex; flex-direction: column;
            align-items: center; gap: 10px; min-width: 340px; max-width: 85vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        #points-list {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
            font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: bold; color: #38bdf8;
            max-height: 110px; overflow-y: auto;
        }
        .point-tag {
            background: rgba(30, 41, 59, 0.9); border: 1px solid #38bdf8; padding: 5px 12px; border-radius: 6px;
            color: #38bdf8; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #clear-btn {
            background: #ef4444; border: none; color: white; padding: 6px 16px;
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
            transition: all 0.2s;
        }
        #clear-btn:hover { background: #dc2626; transform: scale(1.03); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- EKRAN POWITALNY / WYBÓR JĘZYKA -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1 id="wel-title">Globus 3D</h1>
            <p id="wel-desc">Wybierz język, aby rozpocząć pracę z interaktywnym globusem 3D.</p>
            <div class="lang-buttons">
                <button class="lang-btn" onclick="selectLanguage('pl')">🇵🇱 Polski</button>
                <button class="lang-btn" onclick="selectLanguage('en')">🇬🇧 English</button>
            </div>
        </div>
    </div>

    <!-- PANEL STEROWANIA -->
    <div id="ui">
        <div class="section-title" id="lbl-meridians" style="color: #38bdf8;">POŁUDNIKI (Długość °)</div>
        <div class="row">
            <label id="lbl-step1">Krok (°):</label>
            <input type="range" id="step-lon" min="1" max="90" value="15" step="1">
            <span id="val-lon" class="val">15°</span>
        </div>
        <div class="row">
            <label id="lbl-color1">Kolor:</label>
            <input type="color" id="color-lon" value="#38bdf8">
            <label id="lbl-width1">Grubość:</label>
            <input type="range" id="width-lon" min="1" max="10" value="2" step="1">
            <span id="val-w-lon" class="val">2</span>
        </div>

        <div class="section-title" id="lbl-parallels" style="color: #ef4444;">RÓWNOLEŻNIKI (Szerokość °)</div>
        <div class="row">
            <label id="lbl-step2">Krok (°):</label>
            <input type="range" id="step-lat" min="1" max="90" value="10" step="1">
            <span id="val-lat" class="val">10°</span>
        </div>
        <div class="row">
            <label id="lbl-color2">Kolor:</label>
            <input type="color" id="color-lat" value="#ef4444">
            <label id="lbl-width2">Grubość:</label>
            <input type="range" id="width-lat" min="1" max="10" value="2" step="1">
            <span id="val-w-lat" class="val">2</span>
        </div>
    </div>

    <!-- DOLNY PANEL ZE WSPÓŁRZĘDNYMI -->
    <div id="bottom-panel">
        <div id="points-list">Kliknij w dowolne miejsce na kuli, aby dodać punkt</div>
        <button id="clear-btn">Wyczyść punkty</button>
    </div>

    <script>
        const R = 5;
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let pointIndex = 0;
        let currentLang = 'pl';

        // Tłumaczenia interfejsu
        const translations = {
            pl: {
                meridians: "POŁUDNIKI (Długość °)",
                parallels: "RÓWNOLEŻNIKI (Szerokość °)",
                step: "Krok (°):",
                color: "Kolor:",
                width: "Grubość:",
                clickHint: "Kliknij w dowolne miejsce na kuli, aby dodać punkt",
                clearBtn: "Wyczyść punkty"
            },
            en: {
                meridians: "MERIDIANS (Longitude °)",
                parallels: "PARALLELS (Latitude °)",
                step: "Step (°):",
                color: "Color:",
                width: "Width:",
                clickHint: "Click anywhere on the globe to add a point",
                clearBtn: "Clear points"
            }
        };

        function selectLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('lbl-meridians').textContent = t.meridians;
            document.getElementById('lbl-parallels').textContent = t.parallels;
            document.getElementById('lbl-step1').textContent = t.step;
            document.getElementById('lbl-step2').textContent = t.step;
            document.getElementById('lbl-color1').textContent = t.color;
            document.getElementById('lbl-color2').textContent = t.color;
            document.getElementById('lbl-width1').textContent = t.width;
            document.getElementById('lbl-width2').textContent = t.width;
            document.getElementById('clear-btn').textContent = t.clearBtn;
            
            if (pointIndex === 0) {
                document.getElementById('points-list').textContent = t.clickHint;
            }

            // Schowaj ekran powitalny
            document.getElementById('welcome-screen').classList.add('hidden');
        }

        // Scena, Kamera i Oświetlenie
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Światła dla lepszego wyglądu 3D
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        // Kula Ziemska (Główna)
        const globeGeo = new THREE.SphereGeometry(R, 64, 64);
        const globeMat = new THREE.MeshPhongMaterial({
            color: 0x0f172a,
            emissive: 0x070a12,
            shininess: 25,
            flatShading: false
        });
        const globe = new THREE.Mesh(globeGeo, globeMat);
        scene.add(globe);

        // Subtelna atmosfera wokół kuli (Glow)
        const atmosphereGeo = new THREE.SphereGeometry(R * 1.025, 64, 64);
        const atmosphereMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
        scene.add(atmosphere);

        // Grupy na siatkę i znaczniki
        const gridGroup = new THREE.Group();
        const markersGroup = new THREE.Group();
        scene.add(gridGroup);
        scene.add(markersGroup);

        // Tworzenie 3D linii siatki
        function create3DLine(pointsArray, colorHex, thickness) {
            const curve = new THREE.CatmullRomCurve3(pointsArray);
            const tubeRadius = 0.007 * thickness;
            const tubeGeo = new THREE.TubeGeometry(curve, pointsArray.length, tubeRadius, 6, false);
            const tubeMat = new THREE.MeshBasicMaterial({ color: colorHex });
            return new THREE.Mesh(tubeGeo, tubeMat);
        }

        function drawGrid() {
            while(gridGroup.children.length > 0) {
                const child = gridGroup.children[0];
                child.geometry.dispose();
                child.material.dispose();
                gridGroup.remove(child);
            }

            const stepLon = parseInt(document.getElementById('step-lon').value);
            const stepLat = parseInt(document.getElementById('step-lat').value);
            const colorLon = document.getElementById('color-lon').value;
            const colorLat = document.getElementById('color-lat').value;
            const widthLon = parseInt(document.getElementById('width-lon').value);
            const widthLat = parseInt(document.getElementById('width-lat').value);

            // Południki
            for (let lon = 0; lon < 360; lon += stepLon) {
                const radLon = THREE.MathUtils.degToRad(lon);
                const points = [];
                for (let lat = -90; lat <= 90; lat += 3) {
                    const radLat = THREE.MathUtils.degToRad(lat);
                    points.push(new THREE.Vector3(
                        R * Math.cos(radLat) * Math.cos(radLon),
                        R * Math.sin(radLat),
                        R * Math.cos(radLat) * Math.sin(radLon)
                    ));
                }
                gridGroup.add(create3DLine(points, colorLon, widthLon));
            }

            // Równoleżniki
            for (let lat = -90 + stepLat; lat < 90; lat += stepLat) {
                const radLat = THREE.MathUtils.degToRad(lat);
                const rRadius = R * Math.cos(radLat);
                const y = R * Math.sin(radLat);
                const points = [];
                for (let lon = 0; lon <= 360; lon += 3) {
                    const radLon = THREE.MathUtils.degToRad(lon);
                    points.push(new THREE.Vector3(
                        rRadius * Math.cos(radLon),
                        y,
                        rRadius * Math.sin(radLon)
                    ));
                }
                gridGroup.add(create3DLine(points, colorLat, widthLat));
            }
        }

        // Dysk z Literą w przestrzeni 3D
        function create3DLetterMarker(letter) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Czerwone kółko
            ctx.beginPath();
            ctx.arc(64, 64, 54, 0, 2 * Math.PI);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Litera
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 68px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(letter, 64, 68);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.75, 0.75, 1);
            return sprite;
        }

        // Raycasting – Wykrywanie Kliknięcia
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownX = 0;
        let pointerDownY = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerDownX = e.clientX;
            pointerDownY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            // Unikaj kliknięcia podczas obracania myszką
            if (Math.abs(e.clientX - pointerDownX) > 5 || Math.abs(e.clientY - pointerDownY) > 5) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(globe);

            if (intersects.length > 0) {
                const hit = intersects[0].point;

                // Obliczanie wartości szerokości i długości geograficznej
                const lat = Math.asin(hit.y / R) * (180 / Math.PI);
                const lon = Math.atan2(hit.z, hit.x) * (180 / Math.PI);

                const latVal = Math.round(Math.abs(lat));
                const lonVal = Math.round(Math.abs(lon));

                const latDir = lat >= 0 ? 'N' : 'S';
                const lonDir = lon >= 0 ? 'E' : 'W';

                const letter = alphabet[pointIndex % alphabet.length];
                pointIndex++;

                // Tworzenie znacznika 3D tuż nad powierzchnią
                const markerSprite = create3DLetterMarker(letter);
                markerSprite.position.copy(hit.clone().multiplyScalar(1.04));
                markersGroup.add(markerSprite);

                // Zapis w dolnej liście (np. A = 52°N 21°E)
                const list = document.getElementById('points-list');
                if (pointIndex === 1) list.innerHTML = '';

                const tag = document.createElement('div');
                tag.className = 'point-tag';
                tag.textContent = `${letter} = ${latVal}°${latDir} ${lonVal}°${lonDir}`;
                list.appendChild(tag);
            }
        });

        // Wyszczenie punktów
        document.getElementById('clear-btn').addEventListener('click', () => {
            while(markersGroup.children.length > 0) {
                markersGroup.remove(markersGroup.children[0]);
            }
            document.getElementById('points-list').innerHTML = translations[currentLang].clickHint;
            pointIndex = 0;
        });

        function updateUI() {
            document.getElementById('val-lon').textContent = `${document.getElementById('step-lon').value}°`;
            document.getElementById('val-lat').textContent = `${document.getElementById('step-lat').value}°`;
            document.getElementById('val-w-lon').textContent = document.getElementById('width-lon').value;
            document.getElementById('val-w-lat').textContent = document.getElementById('width-lat').value;
            drawGrid();
        }

        ['step-lon', 'step-lat', 'color-lon', 'color-lat', 'width-lon', 'width-lat'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateUI);
        });

        updateUI();

        // Pętla Animacji
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Dopasowanie do zmiany rozmiaru okna
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
